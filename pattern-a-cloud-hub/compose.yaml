# Cloud: Kafka, nats-io/nats-kafka bridge, three NATS hub nodes.
# Sites: two site servers (NATS leaf nodes). Plus one-shot NATS & Kafka setup jobs.
# Start with `make up`: it generates dev certs and config/generated/ first.
# Adding a site: add it to SITES in the Makefile, then copy the site1 service
# and its network below, and update SITES for the setup and kafka-setup services.
name: nats-edge

x-nats: &nats
  image: nats:2.12.5
  environment: &passwords
    CLOUD_APP_PASS: ${CLOUD_APP_PASS:-dev-cloud}
    KAFKA_BRIDGE_PASS: ${KAFKA_BRIDGE_PASS:-dev-bridge}
    DEVICE_PASS: ${DEVICE_PASS:-dev-device}
    SITE_CONTROLLER_PASS: ${SITE_CONTROLLER_PASS:-dev-controller}
    SITE_OPS_PASS: ${SITE_OPS_PASS:-dev-ops}
    SYS_PASS: ${SYS_PASS:-dev-sys}

x-hub: &hub
  <<: *nats
  command: ["-c", "/etc/nats/hub.conf"]

services:
  cloud-hub-1:
    <<: *hub
    container_name: cloud-hub-1
    environment: { <<: *passwords, HUB_NAME: cloud-hub-1 }
    volumes: [./config:/etc/nats:ro, ./certs:/certs:ro, hub1:/data]
    networks: { cloud: {}, wan: { aliases: [cloud-hub] } }
    ports: ["4222:4222", "8222:8222"]

  cloud-hub-2:
    <<: *hub
    container_name: cloud-hub-2
    environment: { <<: *passwords, HUB_NAME: cloud-hub-2 }
    volumes: [./config:/etc/nats:ro, ./certs:/certs:ro, hub2:/data]
    networks: { cloud: {}, wan: { aliases: [cloud-hub] } }
    ports: ["4232:4222"]

  cloud-hub-3:
    <<: *hub
    container_name: cloud-hub-3
    environment: { <<: *passwords, HUB_NAME: cloud-hub-3 }
    volumes: [./config:/etc/nats:ro, ./certs:/certs:ro, hub3:/data]
    networks: { cloud: {}, wan: { aliases: [cloud-hub] } }
    ports: ["4242:4222"]

  # A site reaches the cloud only over `wan`; `make cut-site1` disconnects it.
  # Its own LAN network keeps it reachable from your machine during a cut.
  site1:
    <<: *nats
    container_name: site1
    command: ["-c", "/etc/nats/generated/site1.conf"]
    volumes: [./config:/etc/nats:ro, ./certs:/certs:ro, site1:/data]
    networks: [wan, site1-lan]
    ports: ["4223:4222", "8223:8222"]   # client, monitoring

  site2:
    <<: *nats
    container_name: site2
    command: ["-c", "/etc/nats/generated/site2.conf"]
    volumes: [./config:/etc/nats:ro, ./certs:/certs:ro, site2:/data]
    networks: [wan, site2-lan]
    ports: ["4224:4222", "8224:8222"]

  setup:
    image: natsio/nats-box:0.19.5
    entrypoint: ["sh", "/scripts/setup.sh"]
    environment: { <<: *passwords, SITES: "site1 site2" }
    volumes: [./config:/config:ro, ./certs:/certs:ro, ./scripts:/scripts:ro]
    networks: [cloud, wan]
    depends_on: [cloud-hub-1, cloud-hub-2, cloud-hub-3, site1, site2]

  # Cloud services publish commands to Kafka and read site events from it.
  # One KRaft broker for the demo (production: 3+ brokers, replication 3,
  # min.insync.replicas 2). Only the cloud network reaches it; sites never do.
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created by kafka-setup
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes: [kafka:/var/lib/kafka/data]
    networks: [cloud]
    ports: ["9094:9094"]   # cloud services on your machine: localhost:9094
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 30

  kafka-setup:
    image: apache/kafka:3.9.1
    entrypoint: ["sh", "/scripts/setup-kafka.sh"]
    environment:
      KAFKA_BROKERS: kafka:9092
      SITES: "site1 site2"
      UP_TYPES: "telemetry health result"
      COMMAND_PARTITIONS: 1
      UP_PARTITIONS: 6
      TOPIC_REPLICATION: 1
    volumes: [./scripts:/scripts:ro]
    networks: [cloud]
    depends_on:
      kafka: { condition: service_healthy }

  # Official nats-io/nats-kafka bridge (config generated by scripts/generate.sh):
  #   Down: Kafka cloud.to.site.<site>.command -> NATS cloud-outbox
  #   Up:   NATS cloud-inbox (site.to.cloud.*.<type>) -> Kafka site.to.cloud.<type> (key = <site>)
  kafka-bridge:
    image: natsio/nats-kafka:1.4.2
    container_name: kafka-bridge
    restart: unless-stopped
    command: ["-c", "/etc/nats-kafka/nats-kafka.conf"]
    volumes:
      - ./config/generated/bridge:/etc/nats-kafka:ro
      - ./certs:/certs:ro
    networks: [cloud]
    ports: ["8225:8222"]   # monitoring: http://localhost:8225/healthz, /varz
    depends_on:
      kafka-setup: { condition: service_completed_successfully }
      setup: { condition: service_completed_successfully }

networks:
  cloud: { name: nats-edge-cloud }
  wan: { name: nats-edge-wan }
  site1-lan: { name: nats-edge-site1-lan }
  site2-lan: { name: nats-edge-site2-lan }

volumes:
  hub1:
  hub2:
  hub3:
  site1:
  site2:
  kafka:
