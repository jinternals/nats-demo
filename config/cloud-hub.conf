# =============================================================================
# CLOUD HUB
#
# Owns the durable command queue (FLEET_COMMANDS) and the fleet-wide uplink
# (FLEET_UPLINK, sourced from every site's local stream).
# Sites dial in on 7422. The hub never connects to a site.
# =============================================================================
# One file for all three nodes; each node sets HUB_NAME (cloud-hub-1|2|3).
server_name: $HUB_NAME

# Same black-hole detection on the hub side, so the leaf DISCONNECT event in
# $SYS.ACCOUNT.<SITEn>.DISCONNECT (your site-offline signal) fires in ~1 min.
ping_interval: "20s"
ping_max: 2
listen: 0.0.0.0:4222            # cloud apps

jetstream {
  domain: cloud                 # cloud-side JetStream domain
  store_dir: "./data/cloud"
  max_file_store: 50GB
}

# --- 3-node cluster: streams are R3, so any one node can be lost ------------
# Route port is internal (VPC only). The peer's cert must carry a DNS SAN that
# matches one of the route hosts below. Site certs share the fleet CA but
# have no DNS SAN, so a site can never join the cluster as a hub (tested).
cluster {
  name: cloud
  listen: 0.0.0.0:6222
  routes: [
    "nats-route://cloud-hub-1:6222"
    "nats-route://cloud-hub-2:6222"
    "nats-route://cloud-hub-3:6222"
  ]
  tls {
    cert_file: "./certs/cloud.crt"
    key_file:  "./certs/cloud.key"
    ca_file:   "./certs/ca.crt"
    verify_cert_and_check_known_urls: true
  }
}

# --- client TLS (cloud apps) -------------------------------------------------
tls {
  cert_file: "./certs/cloud.crt"
  key_file:  "./certs/cloud.key"
  ca_file:   "./certs/ca.crt"
}

# --- leaf node listener: every site dials OUT to here ------------------------
leafnodes {
  listen: 0.0.0.0:7422
  # The hub ALWAYS tells connecting leaves its own leaf URL, and leaves add it
  # to their reconnect list. Left unset, that is the pod/VM's private IP, and
  # leaves will reconnect around your load balancer. Set it to the public name.
  # (no_advertise does NOT cover this: in v2.12.1 it only affects gossip to
  # cluster routes -- server/route.go, server/leafnode.go.)
  advertise: "cloud-hub:7422"
  tls {
    cert_file: "./certs/cloud.crt"
    key_file:  "./certs/cloud.key"
    ca_file:   "./certs/ca.crt"
    # Per-leaf identity: each site presents its OWN client cert, signed by
    # the fleet CA. The cert subject IS the username. No shared secret, no
    # password in a URL, and revoking one site never touches another.
    verify_and_map: true
    timeout: 5
  }
}

# --- same leaf identity over WebSocket on 443 --------------------------------
# For sites whose egress allows only HTTPS, often through a corporate proxy.
# A site leaf can dial wss://cloud-hub:443, optionally via HTTP CONNECT, and
# authenticates with the SAME client cert -> same user -> same site account.
# Measured: leaf over wss through a CONNECT proxy, uplink 20/20, command
# delivered, cross-site pull refused, unknown cert -> Authorization Violation.
websocket {
  listen: "0.0.0.0:443"
  tls {
    cert_file: "./certs/cloud.crt"
    key_file:  "./certs/cloud.key"
    ca_file:   "./certs/ca.crt"
    verify_and_map: true
  }
}

# One account per site, generated: ./gen-hub-accounts.sh site1 site2 ...
# Each leaf binds to its own account via its cert subject (verify_and_map).
include "hub-accounts.conf"
