# Site server for site2. Edge apps on the site LAN connect only to this.
server_name: site2
listen: 0.0.0.0:4222
http: 0.0.0.0:8222

# Notice a dead WAN link within about a minute (default: 2m x 2 pings).
ping_interval: "20s"
ping_max: 2

jetstream {
  domain: site2
  store_dir: /data
  max_file_store: 20GB      # uplink rate x the longest outage to survive
  sync_interval: always     # fsync every write; the default is every 2m
}

accounts {
  edge {
    jetstream: enabled
    users: [
      # Edge apps: publish this site's events, pull this site's commands.
      { user: edge-app, password: $EDGE_APP_PASS, permissions: {
          publish: {
            allow: [
              "fleet.site2.>"
              "$JS.API.STREAM.INFO.site2-uplink"
              "_fleet.api.CONSUMER.MSG.NEXT.fleet-commands.site2-commands"
              "_fleet.api.CONSUMER.INFO.fleet-commands.site2-commands"
              "$JS.ACK.fleet-commands.site2-commands.>"
            ]
            deny: [ "fleet.site2.*.command" ]   # commands only come from the cloud
          }
          subscribe: { allow: [ "_INBOX.>" ] }
      }}
      # Provisioning (creates site2-uplink). Not for apps.
      { user: site-ops, password: $SITE_OPS_PASS }
    ]
  }
  system { users: [ { user: sys, password: $SYS_PASS } ] }
}
system_account: system

leafnodes {
  reconnect: "5s"           # plus random jitter of up to 5s
  remotes: [
    {
      urls: [ "tls://cloud-hub:7422" ]
      account: edge
      tls {
        ca_file:   /certs/ca.crt
        cert_file: /certs/site2.crt
        key_file:  /certs/site2.key
      }
      # HTTPS-only network: use urls: [ "wss://cloud-hub:443" ] instead, and
      # if traffic must go through a proxy, add AFTER the tls block:
      #   proxy { url: "http://proxy.example:3128" }
    }
  ]
}
