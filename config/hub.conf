# Cloud hub node. All three nodes use this file; HUB_NAME is set per node.
server_name: $HUB_NAME
listen: 0.0.0.0:4222          # cloud apps
http: 0.0.0.0:8222            # monitoring

# Notice a dead WAN link within about a minute (default: 2m x 2 pings).
ping_interval: "20s"
ping_max: 2

jetstream {
  domain: cloud
  store_dir: /data
}

tls {
  cert_file: /certs/hub.crt
  key_file:  /certs/hub.key
  ca_file:   /certs/ca.crt
}

# Hub-to-hub routes. A peer must present a cert whose DNS name matches one of
# the routes below. Site certs have no DNS name, so a site can't join.
cluster {
  name: cloud
  listen: 0.0.0.0:6222
  routes: [
    nats-route://cloud-hub-1:6222
    nats-route://cloud-hub-2:6222
    nats-route://cloud-hub-3:6222
  ]
  tls {
    cert_file: /certs/hub.crt
    key_file:  /certs/hub.key
    ca_file:   /certs/ca.crt
    verify_cert_and_check_known_urls: true
  }
}

# Sites dial in here. Each site presents its own client cert; the cert
# subject is the user name, and that user lives in the site's own account
# (hub-accounts.conf).
leafnodes {
  listen: 0.0.0.0:7422
  # Leaves add whatever the hub advertises to their reconnect list. Without
  # this they learn the node's private address and bypass the load balancer.
  advertise: "cloud-hub:7422"
  tls {
    cert_file: /certs/hub.crt
    key_file:  /certs/hub.key
    ca_file:   /certs/ca.crt
    verify_and_map: true
  }
}

# The same leaf connection over wss:// for sites that may only use HTTPS.
websocket {
  listen: 0.0.0.0:443
  tls {
    cert_file: /certs/hub.crt
    key_file:  /certs/hub.key
    ca_file:   /certs/ca.crt
    verify_and_map: true
  }
}

include "hub-accounts.conf"
